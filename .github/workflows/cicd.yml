name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cicd:
    uses: ckoliber/dotfiles/.github/workflows/mise.yml@main
    permissions:
      contents: write
    with:
      fetch-depth: 0
      cache-tools: terraform
      script: |
        mise run terraform:deps
        mise run terraform:lint
        if [ "$GITHUB_EVENT_NAME" = push ]; then mise run release:cliff; fi
